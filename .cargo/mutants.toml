# Mutation testing configuration for cargo-mutants
# Run locally: `just mutants` (full) or `just mutants-diff` (changed code only)
# Docs: https://mutants.rs/config-file.html

# Use a fast profile with no debug symbols
profile = "mutants"

# nextest runs each test in its own process, so a mutant is scored the moment a
# test fails. The per-mutant timeout then means "this mutant hung", not "the test
# binary is slow". (Gate-only: the repo's own `cargo test` skips no doctests.)
test_tool = "nextest"

# Only mutate real source code, not generated tables or test fixtures
exclude_globs = [
  "src/case_folding.rs",       # auto-generated Unicode tables
  "src/unicode_categories.rs", # auto-generated Unicode tables
  "src/regexp_samples.rs",     # test fixture data
  "src/test_helpers.rs",       # test utilities
  "src/kani_proofs.rs",        # formal verification, not runtime code
]

# Library unit tests only. Do NOT add `--all-targets`: it builds the Criterion
# benches unoptimized, which overruns the per-mutant timeout and fails the
# baseline. The two excluded tests are slow (concurrent-stress and regexp
# fuzzing) and catch nothing the rest of the suite doesn't.
additional_cargo_test_args = [
  "--lib",
  "-E",
  "not (test(test_concurrent_update_during_matching) | test(test_regexp_validity))",
]

# Skip kani proof harnesses — formal verification, not production code.
#
# The rest are equivalents we can't kill: the mutated operator gives the same
# result as the original for every input, so no test can tell them apart. Each
# has an intent comment at its source site.
exclude_re = [
  "kani_arena_proofs::",
  # WTF-8 tag byte: the tag and payload never share a bit, so `|` and `^`
  # build the same byte.
  'replace \| with \^ in .*read_unicode_escape',
  # Self-loop acceleration is a pure speed-up; toggling when it fires never
  # changes a match.
  'replace == with != in traverse_lazy_dfa',
  # Column-anchored (not line) so it survives edits in the fn; a separate,
  # caught `&&` at another column stays tested.
  ':28: replace && with \|\| in traverse_lazy_dfa',
  # Dedup drops only exact duplicates, so the `> 64` threshold is speed-only.
  'replace > with .* in traverse_arena_nfa',
  # Branch folding: the continuation boundary is never an epsilon-only state
  # mid-fold (a +/* loopback is still empty), and a finished splice collapses to
  # the same closure, so == and != pick the same targets.
  'replace != with == in collect_branch_epsilon_targets',
  # `visited` only de-dups already-flattened splices; no epsilon cycle is
  # reachable mid-fold, so a dropped dedup just repeats a target the closure
  # already ignores.
  'replace \|\| with && in collect_branch_epsilon_targets',
  # Post-fold compaction is cleanup-only: a pattern with no dead states (every
  # non-alternation one) clones to itself, so >1 vs >=1 changes nothing.
  'replace > with >= in regexp_has_alternation',
  # The incremental closure branch reserves capacity as a hint only; the Vec
  # grows as needed, so a wrong reservation (arena_len / or + start_idx) changes
  # how often the buffer reallocates, never the closures it ends up holding.
  # Column-anchored so the return-value arithmetic (caught at another column)
  # stays tested.
  ':40: replace - with .+ in .*precompute_epsilon_closures',
]

# Don't mutate logging/debug/panic macros — not worth testing
skip_calls = [
  "eprintln!",
  "panic!",
  "unreachable!",
  "todo!",
  "unimplemented!",
  "debug_assert!",
  "debug_assert_eq!",
]
