[package]
name = "quamina-flattener-contracts"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
quamina = { path = "../.." }

[features]
default = []
core-boundary = []
messagepack = ["quamina/messagepack"]
cbor = ["quamina/cbor"]
protobuf = ["quamina/protobuf"]
avro = ["quamina/avro"]
headers = ["quamina/headers"]
cloudevents = ["quamina/cloudevents"]
all-formats = [
    "core-boundary",
    "messagepack",
    "cbor",
    "protobuf",
    "avro",
    "headers",
    "cloudevents",
]

[workspace]

[[test]]
name = "golden_json"
path = "tests/golden_json.rs"

[[test]]
name = "core_boundary"
path = "tests/core_boundary.rs"
required-features = ["core-boundary"]

[[test]]
name = "messagepack"
path = "tests/messagepack.rs"
required-features = ["messagepack"]

[[test]]
name = "cbor"
path = "tests/cbor.rs"
required-features = ["cbor"]

[[test]]
name = "protobuf"
path = "tests/protobuf.rs"
required-features = ["protobuf"]

[[test]]
name = "avro"
path = "tests/avro.rs"
required-features = ["avro"]

[[test]]
name = "headers"
path = "tests/headers.rs"
required-features = ["headers"]

[[test]]
name = "cloudevents"
path = "tests/cloudevents.rs"
required-features = ["cloudevents"]

[lints.rust]
warnings = "deny"
# `tests/protobuf.rs` is a pinned contract file we cannot edit. Its
# `descriptor_cycles_are_preprocessed_once_and_clones_have_isolated_decoder_state`
# test declares `let mut clone = ...` and only ever calls `&self` methods on
# it (`flatten_for_contract`/`decoder_state`), while its sibling
# `proto2_and_proto3_presence_never_synthesize_absent_defaults_by_default`
# test calls `flattener.flatten_for_contract(...)` on a binding that is
# *not* `mut` — so `flatten_for_contract` must take `&self` for the file to
# compile at all, which makes the other test's `mut` an unavoidable false
# positive. See the final report for details.
unused_mut = { level = "allow", priority = 1 }
