[package]
name = "quamina"
version = "0.3.0"
edition = "2021"
description = "Fast pattern-matching library for filtering JSON events"
license = "Apache-2.0"
repository = "https://github.com/baldawarishi/quamina-rs"

[dependencies]
arc-swap = "1.7"
parking_lot = "0.12"
smallvec = "1.13"
rustc-hash = "2.1"
memchr = "2.7"
fast-float2 = "0.2"

[features]
dhat-heap = []  # Enable heap profiling with dhat

[dev-dependencies]
criterion = "0.8"
flate2 = "1.0"
rand = "0.10"
regex = "1"  # For benchmarking comparisons
dhat = "0.3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "bulk_10k"
harness = false

[[bench]]
name = "comparable"
harness = false

[[bench]]
name = "memory"
harness = false

[profile.bench]
debug = 1  # Line tables for flamegraph/samply

[profile.release]
debug = 1  # Line tables for flamegraph/samply

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "warn"

[lints.clippy]
perf = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
transmute_ptr_to_ptr = "warn"
# Nursery lints (selectively enabled — see docs/RUST_IDIOMS_SPEC.md §8)
use_self = "warn"
derive_partial_eq_without_eq = "warn"
redundant_clone = "warn"
unused_peekable = "warn"
or_fun_call = "warn"
branches_sharing_code = "warn"
equatable_if_let = "warn"
