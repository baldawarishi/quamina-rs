[package]
name = "quamina"
version = "0.5.0"
edition = "2024"
description = "Fast pattern-matching library for filtering JSON events"
license = "Apache-2.0"
repository = "https://github.com/baldawarishi/quamina-rs"
keywords = ["json", "pattern-matching", "event-filtering", "rules-engine"]
categories = ["algorithms", "text-processing"]
exclude = ["testdata/", "docs/", "examples/", "benches/", "fuzz/", "playground/", ".github/", "scripts/"]

[dependencies]
arc-swap = "1.7"
parking_lot = "0.12"
smallvec = "1.13"
rustc-hash = "2.1"
memchr = "2.7"
fast-float2 = "0.2"

[features]
dhat-heap = []  # Enable heap profiling with dhat

[dev-dependencies]
criterion = "0.8"
flate2 = "1.0"
rand = "0.10"
regex = "1"  # For benchmarking comparisons
dhat = "0.3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "bulk_10k"
harness = false

[[bench]]
name = "memory"
harness = false

[profile.bench]
debug = 1  # Line tables for flamegraph/samply

[profile.release]
debug = 1  # Line tables for flamegraph/samply

[profile.mutants]
inherits = "test"
debug = "none"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "warn"
warnings = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
transmute_ptr_to_ptr = "warn"

# Keep allows for lints that require massive structural/doc rewrites or conflict with performance
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
inline_always = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
option_if_let_else = "allow"
match_wildcard_for_single_variants = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
non_send_fields_in_send_ty = "allow"
significant_drop_tightening = "allow"
doc_link_with_quotes = "allow"
unnecessary_wraps = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
format_in_format_args = "allow"
format_push_string = "allow"
suspicious_operation_groupings = "allow"
trivially_copy_pass_by_ref = "allow"
needless_continue = "allow"
ignore_without_reason = "allow"
missing_fields_in_debug = "allow"
manual_let_else = "allow"
assigning_clones = "allow"
used_underscore_binding = "allow"
string_lit_as_bytes = "allow"

# Nursery lints (selectively enabled/configured)
use_self = "warn"
derive_partial_eq_without_eq = "warn"
redundant_clone = "warn"
unused_peekable = "warn"
or_fun_call = "warn"
branches_sharing_code = "warn"
equatable_if_let = "warn"
disallowed_types = "warn"
