[package]
name = "quamina"
version = "0.2.0"
edition = "2021"
description = "Fast pattern-matching library for filtering JSON events"
license = "Apache-2.0"
repository = "https://github.com/baldawarishi/quamina-rs"

[dependencies]
arc-swap = "1.7"
parking_lot = "0.12"
smallvec = "1.13"
rustc-hash = "2.1"
memchr = "2.7"
fast-float2 = "0.2"

[features]
dhat-heap = []  # Enable heap profiling with dhat

[dev-dependencies]
criterion = "0.8"
flate2 = "1.0"
rand = "0.9"
regex = "1"  # For benchmarking comparisons
dhat = "0.3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "memory"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
transmute_ptr_to_ptr = "warn"
